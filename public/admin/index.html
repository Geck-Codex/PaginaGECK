<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El panel no es contenido del sitio: que Google lo indexe solo gasta
         rastreo en una pantalla de login. robots.txt además lo excluye. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel de contenido · Geck Codex</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!--
      Sveltia CMS — panel de edición del blog.

      La versión va CLAVADA a propósito. Con `@sveltia/cms` sin número, el CDN
      sirve la última publicada, y una actualización del CMS podría romper el
      panel un martes cualquiera sin que nadie haya tocado el repo. Para subir
      de versión se cambia este número a mano, se prueba, y se sube.

      Es el único JavaScript de terceros del sitio que carga desde un CDN, y
      solo vive en /admin: ninguna página pública lo toca, así que no pesa un
      byte para los visitantes.
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.209.2/dist/sveltia-cms.js"
      type="module"
    ></script>
  </body>
</html>
